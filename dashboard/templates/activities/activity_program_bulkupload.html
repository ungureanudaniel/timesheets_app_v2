{% extends 'general/base.html' %}
{% load static %}
{% load i18n %}

{% block content %}
<div class="container-fluid mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Planificare Săptămânală pe Activități</h2>
        <button type="button" class="btn btn-outline-secondary btn-sm" onclick="addActivityCard()">
            <i class="bi bi-plus-lg"></i> Adaugă o activitate nouă
        </button>
    </div>

    <form method="post" id="weekly-program-form">
        {% csrf_token %}
        {{ form.management_form }}

        <!-- Activity Cards Container -->
        <div id="activities-container">
            <div class="card mb-4 border-primary activity-card">
                <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                    <h5 class="card-title mb-0">Activitatea #1</h5>
                    <button type="button" class="btn btn-sm btn-outline-light" onclick="removeActivityCard(this)">
                        Șterge Activitatea
                    </button>
                </div>
                <div class="card-body">
                    <!-- Activity Core Details -->
                    <div class="row g-3 mb-3">
                        <div class="col-md-3">
                            <label class="form-label fw-bold">Săptămâna / Perioada</label>
                            <input type="text" name="activity_0_week" class="form-control" placeholder="ex: Săpt. 12 (23-29 Martie)" required>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label fw-bold">Cod Activitate</label>
                            <select name="{{ form.prefix }}-activity_code" class="form-select form-select-sm">
                                <option value="">-- Selectează --</option>
                                {% for act in activities %}
                                    <option value="{{ act.code }}" {% if form.initial.activity_code == act.code %}selected{% endif %}>
                                        {{ act.code }} - {{ act.name }}
                                    </option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Titlu / Descriere Activitate</label>
                            <input type="text" name="activity_0_title" class="form-control activity-title-input" placeholder="Titlu sau descriere detaliată..." required>
                        </div>
                    </div>

                    <!-- User Selection for this Activity -->
                    <div class="border-top pt-3">
                        <label class="form-label fw-bold d-block">
                            Rangeri Alocați Acestei Activități
                        </label>
                        <div class="row row-cols-1 row-cols-md-3 g-2 rounded p-2 bg-light border">
                            {% for user in active_users %}
                            <div class="col">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" name="activity_0_rangers" value="{{ user.id }}" id="ranger_0_{{ user.id }}">
                                    <label class="form-check-label" for="ranger_0_{{ user.id }}">
                                        {{ user.get_full_name|default:user.username }}
                                    </label>
                                </div>
                            </div>
                            {% empty %}
                            <div class="col-12 text-muted">
                                Nu există utilizatori activi disponibili.
                            </div>
                            {% endfor %}
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="d-flex gap-2 my-4">
            <button type="button" class="btn btn-outline-primary" onclick="addActivityCard()">
                + Adaugă încă o activitate
            </button>
            <button type="submit" class="btn btn-success ms-auto">
                Salvează & Distribuie Planificarea
            </button>
        </div>
    </form>
</div>

<script>
    let activityCount = 1;

    const presetTitles = {
        'PAT01': 'Patrulare teren conform planificării săptămânale',
        'MON02': 'Monitorizare specii protejate și colectare date teren',
        'PAL': 'Activități administrative la sediu / Lucru de birou',
        'INF03': 'Acțiuni de conștientizare și ghidaj vizitatori'
    };

    function updateActivityTitle(selectElem) {
        const card = selectElem.closest('.activity-card');
        const titleInput = card.querySelector('.activity-title-input');
        const selectedCode = selectElem.value;
        if (presetTitles[selectedCode]) {
            titleInput.value = presetTitles[selectedCode];
        }
    }

    function addActivityCard() {
        const container = document.getElementById('activities-container');
        const firstCard = container.querySelector('.activity-card');
        const newCard = firstCard.cloneNode(true);

        activityCount++;
        newCard.querySelector('.card-title').innerText = `Activitatea #${activityCount}`;

        // Reset inputs and update field names with new index
        newCard.querySelectorAll('input, select').forEach(input => {
            if (input.type === 'checkbox') {
                input.checked = false;
                const userId = input.value;
                input.name = `activity_${activityCount - 1}_rangers`;
                input.id = `ranger_${activityCount - 1}_${userId}`;
                const label = input.nextElementSibling;
                if (label) label.setAttribute('for', input.id);
            } else if (input.name) {
                input.value = '';
                const baseName = input.name.replace(/activity_\d+_/, '');
                input.name = `activity_${activityCount - 1}_${baseName}`;
            }
        });

        container.appendChild(newCard);
    }

    function removeActivityCard(btn) {
        const cards = document.querySelectorAll('.activity-card');
        if (cards.length > 1) {
            btn.closest('.activity-card').remove();
        } else {
            alert('Trebuie să existe cel puțin o activitate în planificare.');
        }
    }
</script>
{% endblock %}
